name: Cleanup Vercel Previews

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Delete Preview Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Delete Vercel Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          # Get deployments for this PR's branch
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Cleaning up preview deployments for branch: $BRANCH_NAME"

          # Build team parameter if VERCEL_TEAM_ID is set
          TEAM_PARAM=""
          if [ -n "$VERCEL_TEAM_ID" ]; then
            TEAM_PARAM="&teamId=$VERCEL_TEAM_ID"
          fi

          # List deployments for this branch
          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&meta-githubCommitRef=$BRANCH_NAME$TEAM_PARAM" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json")

          # Extract deployment IDs
          DEPLOYMENT_IDS=$(echo "$DEPLOYMENTS" | jq -r '.deployments[].uid // empty')

          if [ -z "$DEPLOYMENT_IDS" ]; then
            echo "No preview deployments found for branch: $BRANCH_NAME"
            exit 0
          fi

          # Delete each deployment
          for DEPLOYMENT_ID in $DEPLOYMENT_IDS; do
            echo "Deleting deployment: $DEPLOYMENT_ID"
            curl -s -X DELETE \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID$( [ -n "$VERCEL_TEAM_ID" ] && echo "?teamId=$VERCEL_TEAM_ID" )" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json"
            echo "Deleted deployment: $DEPLOYMENT_ID"
          done

          echo "Cleanup complete!"
